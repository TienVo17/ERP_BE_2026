components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "RS256 access JWT signed by an RSA-3072 key with a kid header and a 15 minute lifetime."
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: "Required for unsafe cookie-backed Auth calls. Reacquire it after login and logout."
    refreshCookie:
      type: apiKey
      in: cookie
      name: ERP_REFRESH
      description: "Rotating opaque refresh token. Secure HttpOnly SameSite=Strict and scoped to /api/v1/auth. Only its hash is stored server-side."
  parameters:
    Page:
      name: page
      in: query
      description: "Zero-based page index."
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: "Page size."
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Sort:
      name: sort
      in: query
      description: "Repeatable allowlisted sort term written as field,direction. Repeat the parameter to add a secondary term such as a stable id tiebreaker."
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, example: "code,asc" }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "Quoted optimistic version of the addressed resource."
      schema: { type: string, pattern: '^"[0-9]+"$' }
  responses:
    BadRequest:
      description: "INVALID_REQUEST or VALIDATION_FAILED, including unknown request members."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthenticated:
      description: "UNAUTHENTICATED, CSRF_INVALID or REFRESH_REAUTH_REQUIRED. The SPA may attempt one refresh for these codes."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: "FORBIDDEN when effective permissions deny the operation, or PASSWORD_CHANGE_REQUIRED when a restricted challenge calls anything other than change-password or logout. Neither code may trigger a refresh attempt."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: "NOT_FOUND for the addressed resource or ownership path."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: "VERSION_CONFLICT, DUPLICATE_BUSINESS_KEY, MASTER_IN_USE or RECOVERY_ADMIN_REQUIRED."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    RateLimited:
      description: "RATE_LIMITED without disclosing whether an account or token exists."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  schemas:
    DecimalQuantity:
      type: string
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      description: "Non-negative decimal quantity carried as a JSON string with up to four decimal places."
    DecimalPrice:
      type: string
      pattern: '^\d{1,12}(\.\d{1,6})?$'
      description: "Non-negative reference price carried as a JSON string with up to six decimal places."
    DecimalRate:
      type: string
      pattern: '^(?=.*[1-9])\d{1,12}(\.\d{1,6})?$'
      description: "Positive exchange rate carried as a JSON string with up to six decimal places."
    YearMonth:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      description: "Effective month that persistence normalizes to the first calendar day."
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: "Stable machine-readable error code." }
        traceId: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    PageMetadata:
      type: object
      additionalProperties: false
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AppliedFilters:
      type: object
      additionalProperties: true
      description: "Echo of the accepted allowlisted filters only."
    AppliedSort:
      type: array
      items: { type: string }
      description: "Echo of the normalized allowlisted sort terms."
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, description: "Double-submit CSRF token. Not a credential for business APIs." }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginId, password]
      properties:
        loginId: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, writeOnly: true }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, writeOnly: true }
        newPassword: { type: string, minLength: 12, writeOnly: true }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword: { type: string, minLength: 12, writeOnly: true, description: "Accepted over TLS only and never returned, logged or audited." }
        reason: { type: string, description: "Audited administrative reason." }
    LoginResponse:
      description: "Either a normal authenticated session or a restricted one-time password-change challenge. Clients branch on the required purpose member."
      oneOf:
        - $ref: '#/components/schemas/NormalAuthResponse'
        - $ref: '#/components/schemas/PasswordChangeChallengeResponse'
      discriminator:
        propertyName: purpose
        mapping:
          session: '#/components/schemas/NormalAuthResponse'
          password_change: '#/components/schemas/PasswordChangeChallengeResponse'
    NormalAuthResponse:
      type: object
      additionalProperties: false
      required: [purpose, accessToken, tokenType, expiresIn, session]
      description: "The access token is returned to the SPA, held only in memory and never persisted client-side."
      properties:
        purpose: { type: string, enum: [session] }
        accessToken: { type: string, description: "Access JWT for business APIs. Responses are sent with Cache-Control no-store." }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: "Access token lifetime in seconds." }
        session: { $ref: '#/components/schemas/SessionResponse' }
    PasswordChangeChallengeResponse:
      type: object
      additionalProperties: false
      required: [purpose, accessToken, tokenType, expiresAt, user]
      description: "Restricted challenge issued when a forced password change is pending. No refresh cookie is set and the challenge is invalid after one successful change."
      properties:
        purpose: { type: string, enum: [password_change] }
        accessToken: { type: string, description: "Restricted token that can call only change-password and logout." }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time, description: "Challenge expiry; it is also invalidated after one successful change." }
        user: { $ref: '#/components/schemas/ChallengeUserResponse' }
    ChallengeUserResponse:
      type: object
      additionalProperties: false
      required: [id, loginId, name]
      description: "Minimal identity so the forced-change screen can render without calling a business endpoint."
      properties:
        id: { type: string, format: uuid }
        loginId: { type: string }
        name: { type: string }
    SessionResponse:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastRefreshedAt, idleExpiresAt, absoluteExpiresAt, current]
      properties:
        id: { type: string, format: uuid }
        clientIp: { type: string, description: "Trusted client IP recorded for the session." }
        userAgent: { type: string, description: "Truncated user agent used to tell devices apart." }
        createdAt: { type: string, format: date-time }
        lastRefreshedAt: { type: string, format: date-time }
        idleExpiresAt: { type: string, format: date-time, description: "Advances only on a successful refresh." }
        absoluteExpiresAt: { type: string, format: date-time }
        current: { type: boolean }
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [id, loginId, name, status, roles, permissions, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        loginId: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED, ARCHIVED] }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionResponse' }
        mustChangePassword: { type: boolean }
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, loginId, temporaryPassword, position, name]
      description: "Creates the credential and profile only. Roles and overrides are assigned by their own commands."
      properties:
        kind: { type: string, enum: [USER, STAFF] }
        loginId: { type: string, minLength: 1, description: "Canonical unique and immutable after creation." }
        temporaryPassword: { type: string, minLength: 12, writeOnly: true, description: "Hashed immediately, never echoed, and forces a password change." }
