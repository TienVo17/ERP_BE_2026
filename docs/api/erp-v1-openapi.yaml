    get:
      operationId: listDebitProjection
      summary: "List the live read-only Debit projection from POSTED Delivery lines"
      description: "Filters: customerId, deliveryNo, sysPoNo, buyerPo, deliveryDateFrom, deliveryDateTo, currencyCode. Sort allowlist is deliveryDate, deliveryNo, lineNo and deliveryNoteItemId."
      security: [{ bearerAuth: [] }]
      x-required-permission: "DELIVERY:VIEW"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: deliveryNo, in: query, schema: { type: string } }
        - { name: sysPoNo, in: query, schema: { type: string } }
        - { name: buyerPo, in: query, schema: { type: string } }
        - { name: deliveryDateFrom, in: query, schema: { type: string, format: date } }
        - { name: deliveryDateTo, in: query, schema: { type: string, format: date } }
        - { name: currencyCode, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200':
          description: "Paged active Debit projection."
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/DebitNotePageResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/debit-notes/export.xlsx:
    get:
      operationId: exportDebitProjection
      summary: "Stream the filtered live Debit projection as XLSX"
      description: "Uses the same filters/sort as list, rejects more than 50,000 rows, neutralizes spreadsheet formula injection, is generated synchronously, and is never persisted."
      security: [{ bearerAuth: [] }]
      x-required-permission: "DELIVERY:EXPORT"
      parameters:
        - $ref: '#/components/parameters/Sort'
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: deliveryNo, in: query, schema: { type: string } }
        - { name: sysPoNo, in: query, schema: { type: string } }
        - { name: buyerPo, in: query, schema: { type: string } }
        - { name: deliveryDateFrom, in: query, schema: { type: string, format: date } }
        - { name: deliveryDateTo, in: query, schema: { type: string, format: date } }
        - { name: currencyCode, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200':
          description: "Debit XLSX."
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/ReportLimitExceeded' }
        '429': { $ref: '#/components/responses/ReportBusy' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "RS256 access JWT signed by an RSA-3072 key with a kid header and a 15 minute lifetime."
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: "Required for unsafe cookie-backed Auth calls. Reacquire it after login and logout."
    refreshCookie:
      type: apiKey
      in: cookie
      name: ERP_REFRESH
      description: "Rotating opaque refresh token. Secure HttpOnly SameSite=Strict and scoped to /api/v1/auth. Only its hash is stored server-side."
  headers:
    NoStore:
      description: "Always no-store for protected transaction and report responses."
      schema: { type: string, enum: [no-store] }
    ContentDisposition:
      description: "Attachment filename sanitized by the server; no client-controlled path or markup."
      schema: { type: string }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Opaque client retry key, scoped by actor, method, and normalized path. The request hash includes body and If-Match. Retained for 24 hours."
      schema: { type: string, minLength: 1, maxLength: 120 }
    Page:
      name: page
      in: query
      description: "Zero-based page index."
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: "Page size."
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Sort:
      name: sort
      in: query
      description: "Repeatable allowlisted sort term written as field,direction. Repeat the parameter to add a secondary term such as a stable id tiebreaker."
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, example: "code,asc" }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "Quoted optimistic version of the addressed resource."
      schema: { type: string, pattern: '^"[0-9]+"$' }
  responses:
    BadRequest:
      description: "INVALID_REQUEST or VALIDATION_FAILED, including unknown request members."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthenticated:
      description: "UNAUTHENTICATED, CSRF_INVALID or REFRESH_REAUTH_REQUIRED. The SPA may attempt one refresh for these codes."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: "FORBIDDEN when effective permissions deny the operation, or PASSWORD_CHANGE_REQUIRED when a restricted challenge calls anything other than change-password or logout. Neither code may trigger a refresh attempt."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: "NOT_FOUND for the addressed resource or ownership path."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: "VERSION_CONFLICT, DUPLICATE_BUSINESS_KEY, MASTER_IN_USE or RECOVERY_ADMIN_REQUIRED."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    RateLimited:
      description: "RATE_LIMITED without disclosing whether an account or token exists."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    CommandConflict:
      description: "VERSION_CONFLICT, IDEMPOTENCY_IN_PROGRESS, invalid transition, downstream activity, stock conflict, or another stable command conflict."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    IdempotencyInProgress:
      description: "An execution with this scoped key and request hash is active."
      headers:
        Retry-After: { schema: { type: integer, enum: [2] } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    IdempotencyResultExpired:
      description: "A quarantined legacy same-hash result cannot be replayed until its record is purged."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    UnprocessableCommand:
      description: "IDEMPOTENCY_KEY_REUSED or another semantically invalid command."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ReportLimitExceeded:
      description: "REPORT_LIMIT_EXCEEDED before report generation begins."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ReportBusy:
      description: "Both report generation slots are occupied on this single backend instance."
      headers:
        Retry-After: { schema: { type: integer, enum: [5] } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  schemas:
    DecimalQuantity:
      type: string
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      description: "Non-negative decimal quantity carried as a JSON string with up to four decimal places."
    DecimalPrice:
      type: string
      pattern: '^\d{1,12}(\.\d{1,6})?$'
      description: "Non-negative reference price carried as a JSON string with up to six decimal places."
    DecimalRate:
      type: string
      pattern: '^(?=.*[1-9])\d{1,12}(\.\d{1,6})?$'
      description: "Positive exchange rate carried as a JSON string with up to six decimal places."
    YearMonth:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      description: "Effective month that persistence normalizes to the first calendar day."
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: "Stable machine-readable error code."
          enum:
            - INVALID_REQUEST
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - CSRF_INVALID
            - REFRESH_REAUTH_REQUIRED
            - PASSWORD_CHANGE_REQUIRED
            - FORBIDDEN
            - NOT_FOUND
            - VERSION_CONFLICT
            - DUPLICATE_BUSINESS_KEY
            - MASTER_IN_USE
            - RECOVERY_ADMIN_REQUIRED
            - EXCHANGE_RATE_MISSING
            - RATE_LIMITED
            - INTERNAL_ERROR
            - IF_MATCH_REQUIRED
            - INVALID_IF_MATCH
            - IDEMPOTENCY_KEY_REQUIRED
            - INVALID_IDEMPOTENCY_KEY
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_IN_PROGRESS
            - IDEMPOTENCY_RESULT_EXPIRED
            - INVALID_STATE_TRANSITION
            - DOWNSTREAM_ACTIVITY_EXISTS
            - GROUP_MEMBERSHIP_INVALID
            - PRODUCTION_ALREADY_FINISHED
            - INSUFFICIENT_STOCK
            - DELIVERY_ALREADY_POSTED
            - DELIVERY_ALREADY_REVERSED
            - DELIVERY_HAS_RETURNS
            - RETURN_LIMIT_EXCEEDED
            - DISPOSAL_EXCEEDS_STOCK
            - REPORT_LIMIT_EXCEEDED
            - REPORT_BUSY
        traceId: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    PageMetadata:
      type: object
      additionalProperties: false
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AppliedFilters:
      type: object
      additionalProperties: true
      description: "Echo of the accepted allowlisted filters only."
    AppliedSort:
      type: array
      items: { type: string }
      description: "Echo of the normalized allowlisted sort terms."
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, description: "Double-submit CSRF token. Not a credential for business APIs." }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginId, password]
      properties:
        loginId: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, writeOnly: true }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, writeOnly: true }
        newPassword: { type: string, minLength: 12, writeOnly: true }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword: { type: string, minLength: 12, writeOnly: true, description: "Accepted over TLS only and never returned, logged or audited." }
        reason: { type: string, description: "Audited administrative reason." }
    LoginResponse:
      description: "Either a normal authenticated session or a restricted one-time password-change challenge. Clients branch on the required purpose member."
      oneOf:
        - $ref: '#/components/schemas/NormalAuthResponse'
        - $ref: '#/components/schemas/PasswordChangeChallengeResponse'
      discriminator:
        propertyName: purpose
        mapping:
          session: '#/components/schemas/NormalAuthResponse'
          password_change: '#/components/schemas/PasswordChangeChallengeResponse'
    NormalAuthResponse:
      type: object
      additionalProperties: false
      required: [purpose, accessToken, tokenType, expiresIn, session]
      description: "The access token is returned to the SPA, held only in memory and never persisted client-side."
      properties:
        purpose: { type: string, enum: [session] }
        accessToken: { type: string, description: "Access JWT for business APIs. Responses are sent with Cache-Control no-store." }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: "Access token lifetime in seconds." }
        session: { $ref: '#/components/schemas/SessionResponse' }
    PasswordChangeChallengeResponse:
      type: object
      additionalProperties: false
      required: [purpose, accessToken, tokenType, expiresAt, user]
      description: "Restricted challenge issued when a forced password change is pending. No refresh cookie is set and the challenge is invalid after one successful change."
      properties:
        purpose: { type: string, enum: [password_change] }
        accessToken: { type: string, description: "Restricted token that can call only change-password and logout." }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time, description: "Challenge expiry; it is also invalidated after one successful change." }
        user: { $ref: '#/components/schemas/ChallengeUserResponse' }
    ChallengeUserResponse:
      type: object
      additionalProperties: false
      required: [id, loginId, name]
      description: "Minimal identity so the forced-change screen can render without calling a business endpoint."
      properties:
        id: { type: string, format: uuid }
        loginId: { type: string }
        name: { type: string }
    SessionResponse:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastRefreshedAt, idleExpiresAt, absoluteExpiresAt, current]
      properties:
        id: { type: string, format: uuid }
        clientIp: { type: string, description: "Trusted client IP recorded for the session." }
        userAgent: { type: string, description: "Truncated user agent used to tell devices apart." }
        createdAt: { type: string, format: date-time }
        lastRefreshedAt: { type: string, format: date-time }
        idleExpiresAt: { type: string, format: date-time, description: "Advances only on a successful refresh." }
        absoluteExpiresAt: { type: string, format: date-time }
        current: { type: boolean }
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [id, loginId, name, status, roles, permissions, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        loginId: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED, ARCHIVED] }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionResponse' }
        mustChangePassword: { type: boolean }
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, loginId, temporaryPassword, position, name]
      description: "Creates the credential and profile only. Roles and overrides are assigned by their own commands."
      properties:
        kind: { type: string, enum: [USER, STAFF] }
        loginId: { type: string, minLength: 1, description: "Canonical unique and immutable after creation." }
        temporaryPassword: { type: string, minLength: 12, writeOnly: true, description: "Hashed immediately, never echoed, and forces a password change." }
        position: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        groupName: { type: string }
        division: { type: string }
        sex: { type: string, enum: [MALE, FEMALE, OTHER] }
        phone: { type: string }
        email: { type: string, format: email }
        remark: { type: string }
    UserProfileUpdateRequest:
      type: object
      additionalProperties: false
      required: [position, name]
      description: "Profile fields only. Login ID, credentials, status, roles and overrides are out of scope for this command."
      properties:
        position: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        groupName: { type: string }
        division: { type: string }
        sex: { type: string, enum: [MALE, FEMALE, OTHER] }
        phone: { type: string }
        email: { type: string, format: email }
        remark: { type: string }
    UserStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED, ARCHIVED] }
        reason: { type: string, minLength: 1, description: "Audited administrative reason." }
    UserRolesUpdateRequest:
      type: object
      additionalProperties: false
      required: [roleIds]
      properties:
        roleIds:
          type: array
          items: { type: string, format: uuid }
        reason: { type: string }
    UserPermissionOverridesUpdateRequest:
      type: object
      additionalProperties: false
      required: [overrides]
      properties:
        overrides:
          type: array
          items: { $ref: '#/components/schemas/PermissionOverrideRequest' }
        reason: { type: string }
    PermissionOverrideRequest:
      type: object
      additionalProperties: false
      required: [permissionId, effect]
      description: "References a seeded permission row; arbitrary module or action strings are not accepted."
      properties:
        permissionId: { type: string, format: uuid }
        effect: { type: string, enum: [ALLOW, DENY] }
        reason: { type: string }
    PermissionOverrideResponse:
      type: object
      additionalProperties: false
      required: [permissionId, module, action, effect]
      properties:
        permissionId: { type: string, format: uuid }
        module: { type: string }
        action: { type: string }
        effect: { type: string, enum: [ALLOW, DENY] }
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, version, status, kind, loginId, name, position, roleIds, permissionOverrides, mustChangePassword, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, DISABLED, ARCHIVED] }
        kind: { type: string, enum: [USER, STAFF] }
        loginId: { type: string }
        name: { type: string }
        position: { type: string }
        groupName: { type: string }
        division: { type: string }
        sex: { type: string }
        phone: { type: string }
        email: { type: string }
        remark: { type: string }
        roleIds:
          type: array
          items: { type: string, format: uuid }
        permissionOverrides:
          type: array
          items: { $ref: '#/components/schemas/PermissionOverrideResponse' }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoleRequest:
      type: object
      additionalProperties: false
      required: [code, name, permissionIds]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', description: "Immutable business key after creation." }
        name: { type: string, minLength: 1 }
        description: { type: string }
        permissionIds:
          type: array
          items: { type: string, format: uuid }
    RoleUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, active, permissionIds]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        active: { type: boolean }
        permissionIds:
          type: array
          items: { type: string, format: uuid }
        reason: { type: string }
    RoleResponse:
      type: object
      additionalProperties: false
      required: [id, version, code, name, active, permissionIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        active: { type: boolean }
        permissionIds:
          type: array
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PermissionResponse:
      type: object
      additionalProperties: false
      required: [id, module, action, active]
      properties:
        id: { type: string, format: uuid }
        module: { type: string }
        action: { type: string }
        description: { type: string }
        active: { type: boolean }
    LoginEventResponse:
      type: object
      additionalProperties: false
      required: [id, loginId, outcome, occurredAt]
      description: "Redacted append-only record. It never carries passwords, hashes, tokens or SQL detail."
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid, description: "Absent when the attempted login ID matched no user." }
        loginId: { type: string, description: "Attempted login ID." }
        userName: { type: string }
        outcome: { type: string, enum: [SUCCESS, INVALID_CREDENTIALS, DISABLED, BLOCKED_IP, LOCKED, ERROR] }
        clientIp: { type: string }
        ipName: { type: string, description: "Allowlist name snapshot taken when the event was recorded." }
        userAgent: { type: string }
        occurredAt: { type: string, format: date-time }
    IpAllowlistCreateRequest:
      type: object
      additionalProperties: false
      required: [network, name]
      properties:
        network: { type: string, description: "Canonical IPv4 or IPv6 address or CIDR network." }
        name: { type: string, minLength: 1 }
    IpAllowlistUpdateRequest:
      type: object
      additionalProperties: false
      required: [network, name, active]
      properties:
        network: { type: string }
        name: { type: string, minLength: 1 }
        active: { type: boolean }
    IpAllowlistEntryResponse:
      type: object
      additionalProperties: false
      required: [id, version, network, name, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        network: { type: string }
        name: { type: string }
        active: { type: boolean, description: "Entry activation only. It does not enable enforcement." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CurrencyResponse:
      type: object
      additionalProperties: false
      required: [code, name, active]
      properties:
        code: { type: string, pattern: '^[A-Z]{3}$' }
        name: { type: string }
        active: { type: boolean }
    UomRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, description: "Canonical unique code." }
        name: { type: string }
    UomResponse:
      type: object
      additionalProperties: false
      required: [id, version, status, code, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        code: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExchangeRateRequest:
      type: object
      additionalProperties: false
      required: [month, vndUsdRate, wonUsdRate]
      description: "One record per effective month carrying both USD-base rates, matching the unique monthly row in persistence."
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        vndUsdRate: { $ref: '#/components/schemas/DecimalRate' }
        wonUsdRate: { $ref: '#/components/schemas/DecimalRate' }
        source: { type: string, description: "Optional provenance label for the fetched rates." }
    ExchangeRateResponse:
      type: object
      additionalProperties: false
      required: [id, version, status, month, vndUsdRate, wonUsdRate, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        month: { $ref: '#/components/schemas/YearMonth' }
        vndUsdRate: { $ref: '#/components/schemas/DecimalRate' }
        wonUsdRate: { $ref: '#/components/schemas/DecimalRate' }
        source: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContactCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        division: { type: string }
        name: { type: string, minLength: 1 }
