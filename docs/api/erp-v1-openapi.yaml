openapi: 3.1.0
info:
  title: ERP Operational Core API
  version: 1.0.0
  description: "Phase 1 production contract. Lifecycle and scope live in operational-core-v1-spec.md; shared rules live in api-conventions.md."
servers:
  - url: https://erp.example.invalid
    description: "Same-site reverse proxy that forwards /api to the backend."
paths:
  /api/v1/auth/csrf:
    get:
      operationId: acquireCsrf
      summary: "Acquire or reacquire the SPA CSRF token before an unsafe cookie-backed Auth call"
      responses:
        '200':
          description: "CSRF token issued. Login and logout reset CSRF state, so the SPA must call this again afterwards."
          headers:
            Set-Cookie:
              description: "CSRF cookie for the double-submit check. Never contains refresh material."
              schema: { type: string }
            Cache-Control:
              description: "Always no-store."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: "Authenticate with login ID and password; the client cannot select a role"
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: "Normal login returns an access JWT and sets the rotating refresh cookie. A user awaiting a forced change receives only the restricted challenge and no refresh cookie."
          headers:
            Set-Cookie:
              description: "Secure HttpOnly SameSite=Strict refresh cookie scoped to /api/v1/auth. Absent for the password-change challenge."
              schema: { type: string }
            Cache-Control:
              description: "Always no-store so the access token is never cached."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: "Rotate the cookie-only refresh token"
      description: "Requires both the refresh cookie and the CSRF header. Replaying a rotated token revokes the session family and returns REFRESH_REAUTH_REQUIRED."
      security:
        - refreshCookie: []
          csrfToken: []
      responses:
        '200':
          description: "Rotation succeeded; the response sets a new refresh cookie and advances the idle window."
          headers:
            Set-Cookie:
              description: "Rotated Secure HttpOnly refresh cookie."
              schema: { type: string }
            Cache-Control:
              description: "Always no-store."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NormalAuthResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: "Revoke the current session family and clear the refresh cookie"
      description: "Normal sessions authenticate with the refresh cookie and CSRF header. A restricted password-change challenge has no refresh cookie and logs out with its bearer token."
      security:
        - refreshCookie: []
          csrfToken: []
        - bearerAuth: []
      responses:
        '204':
          description: "Logged out. CSRF state is cleared, so the SPA reacquires a token before its next unsafe call."
          headers:
            Set-Cookie:
              description: "Expired refresh cookie."
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: "Current identity, roles and effective permissions"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Effective permissions are loaded per request from PostgreSQL, not from token claims."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/sessions:
    get:
      operationId: listCurrentUserSessions
      summary: "List the caller's own browser and device sessions"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: "Sessions carry no token material. Sort allowlist is createdAt, lastRefreshedAt and id."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/sessions/{sessionId}/revoke:
    post:
      operationId: revokeCurrentUserSession
      summary: "Revoke one session owned by the caller"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: "Session revoked. Revoking the current session also clears its refresh cookie."
          headers:
            Set-Cookie:
              description: "Expired refresh cookie when the caller revoked its own current session."
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      summary: "Change the caller's password from a normal session or a one-time restricted challenge"
      description: "A successful change invalidates the challenge, advances the credential generation, revokes previous sessions and issues a normal token pair."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: "Password changed; a normal access token and refresh cookie are issued."
          headers:
            Set-Cookie:
              description: "New Secure HttpOnly refresh cookie."
              schema: { type: string }
            Cache-Control:
              description: "Always no-store."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NormalAuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: "Paged user administration list"
      description: "Only USER and STAFF principals are administrable. The migration-seeded SYSTEM principal that owns reference rows is never listed, updated, assigned roles or overrides, reset, or counted as a recovery-capable admin."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_USERS"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          description: "Allowlisted filter."
          schema: { type: string, enum: [ACTIVE, DISABLED, ARCHIVED] }
        - name: kind
          in: query
          description: "Allowlisted filter across administrable principal kinds."
          schema: { type: string, enum: [USER, STAFF] }
        - name: loginId
          in: query
          description: "Allowlisted canonical login ID filter."
          schema: { type: string }
        - name: name
          in: query
          description: "Allowlisted name filter."
          schema: { type: string }
      responses:
        '200':
          description: "Sort allowlist is loginId, name, status and id."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      summary: "Create a user with an admin-entered temporary password"
      description: "The temporary password is accepted over TLS only, hashed immediately, never echoed or logged, and forces a password change."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_USERS"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: "User created with mustChangePassword true and no role or override assignment."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}:
    get:
      operationId: getUser
      summary: "Read one user"
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_USERS"
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: "User profile, roles and overrides without credential material."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateUserProfile
      summary: "Update editable profile fields only"
      description: "Login ID is immutable. Status, roles and permission overrides have their own commands with their own permissions."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_USERS"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdateRequest' }
      responses:
        '200':
          description: "Profile updated and audited."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/status:
    put:
      operationId: updateUserStatus
      summary: "Enable, disable or archive a user"
      description: "Disable and archive revoke every session. The command is rejected when its post-state would leave fewer than two independent recovery-capable admins."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_USERS"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusUpdateRequest' }
      responses:
        '200':
          description: "Status changed with an audited reason."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/roles:
    put:
      operationId: replaceUserRoles
      summary: "Replace a user's role assignments"
      description: "Separated from profile administration so that granting authority requires ADMIN:MANAGE_ROLES."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ROLES"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRolesUpdateRequest' }
      responses:
        '200':
          description: "Roles replaced, audited and effective on the next request."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/permission-overrides:
    put:
      operationId: replaceUserPermissionOverrides
      summary: "Replace a user's explicit ALLOW and DENY overrides"
      description: "Each override references a seeded permission ID. Explicit DENY always wins over ALLOW and role grants."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ROLES"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPermissionOverridesUpdateRequest' }
      responses:
        '200':
          description: "Overrides replaced and audited."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/reset-password:
    post:
      operationId: resetUserPassword
      summary: "Set a temporary password over TLS and force a change"
      description: "The temporary password is never echoed, logged or written to audit payloads. All sessions of the target user are revoked. Because the reset removes the target from the recovery-capable set until the forced change completes, the command is destructive and is rejected when its post-state leaves fewer than two independent recovery-capable admins."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_USERS"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: "Password reset, sessions revoked and mustChangePassword set."
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/roles:
    get:
      operationId: listRoles
      summary: "Paged role list"
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ROLES"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: active
          in: query
          description: "Allowlisted filter."
          schema: { type: boolean }
      responses:
        '200':
          description: "Sort allowlist is code, name and id."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRole
      summary: "Create a role from the seeded permission catalog"
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ROLES"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleRequest' }
      responses:
        '201':
          description: "Role created."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/roles/{roleId}:
    get:
      operationId: getRole
      summary: "Read one role"
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ROLES"
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: "Role with its granted permission IDs."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateRole
      summary: "Update a role's name, activation and grants"
      description: "Role code is the immutable business key. Grants reference seeded permission IDs only."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ROLES"
      parameters:
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdateRequest' }
      responses:
        '200':
          description: "Role updated and audited. Recovery-admin invariant is enforced on the post-state."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/permissions:
    get:
      operationId: listPermissions
      summary: "Read the seeded permission catalog"
      description: "The catalog is fixed by migration. Phase 1 has no endpoint that creates module or action codes."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ROLES"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: module
          in: query
          description: "Allowlisted module filter."
          schema: { type: string }
      responses:
        '200':
          description: "Sort allowlist is module, action and id."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/login-events:
    get:
      operationId: listLoginEvents
      summary: "Read the append-only login history"
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:VIEW_AUDIT"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: userId
          in: query
          description: "Allowlisted filter."
          schema: { type: string, format: uuid }
        - name: loginId
          in: query
          description: "Allowlisted attempted login ID filter."
          schema: { type: string }
        - name: outcome
          in: query
          description: "Allowlisted outcome filter."
          schema: { type: string, enum: [SUCCESS, INVALID_CREDENTIALS, DISABLED, BLOCKED_IP, LOCKED, ERROR] }
        - name: from
          in: query
          description: "Inclusive lower bound on occurredAt."
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: "Exclusive upper bound on occurredAt."
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: "Read-only events with no credential detail. Sort allowlist is occurredAt and id."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEventPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/ip-allowlist:
    get:
      operationId: listIpAllowlist
      summary: "Read allowlist entries; enforcement is deferred"
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ALLOWLIST"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: active
          in: query
          description: "Allowlisted filter."
          schema: { type: boolean }
      responses:
        '200':
          description: "The response always reports enforced false. No request is blocked by this list in Phase 1. Sort allowlist is network, name and id."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IpAllowlistPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createIpAllowlistEntry
      summary: "Create one allowlist entry"
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ALLOWLIST"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IpAllowlistCreateRequest' }
      responses:
        '201':
          description: "Entry created with a canonical unique network."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IpAllowlistEntryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/ip-allowlist/{entryId}:
    get:
      operationId: getIpAllowlistEntry
      summary: "Read one allowlist entry"
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ALLOWLIST"
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '200':
          description: "Entry with its optimistic version."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IpAllowlistEntryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateIpAllowlistEntry
      summary: "Update an allowlist entry name, network or activation"
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ALLOWLIST"
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IpAllowlistUpdateRequest' }
      responses:
        '200':
          description: "Entry updated under optimistic concurrency."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IpAllowlistEntryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteIpAllowlistEntry
      summary: "Delete an allowlist entry"
      description: "Allowlist entries carry no history obligation, so removal is a real delete guarded by If-Match rather than an archive transition."
      security:
        - bearerAuth: []
      x-required-permission: "ADMIN:MANAGE_ALLOWLIST"
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: "Entry deleted and audited."
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
